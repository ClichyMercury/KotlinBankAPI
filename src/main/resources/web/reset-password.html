<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nouveau mot de passe — FinSim</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #d8dbe0;
    --accent: #1a7f5a;
    --accent-text: #ffffff;
    --error: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card: #1d2025;
      --text: #f2f3f5;
      --muted: #9aa1ab;
      --border: #333842;
      --accent: #2ea37a;
      --accent-text: #08120d;
      --error: #f28b82;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 14px;
    padding: 32px;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
  }
  h1 { margin: 0 0 8px; font-size: 21px; }
  p.lead { margin: 0 0 24px; color: var(--muted); font-size: 15px; }
  label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; }
  input {
    width: 100%;
    padding: 11px 12px;
    margin-bottom: 18px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--card);
    color: var(--text);
    font-size: 16px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 9px;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .msg { margin: 0 0 18px; padding: 12px 14px; border-radius: 9px; font-size: 14px; display: none; }
  .msg.error { display: block; background: rgba(180, 35, 24, .1); color: var(--error); }
  .msg.ok { display: block; background: rgba(26, 127, 90, .12); color: var(--accent); }
  .hint { margin: 18px 0 0; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Nouveau mot de passe</h1>
  <p class="lead">Choisissez un mot de passe pour votre compte FinSim.</p>

  <p id="message" class="msg" role="status"></p>

  <form id="form" novalidate>
    <label for="password">Mot de passe</label>
    <input id="password" type="password" autocomplete="new-password" minlength="8" required>

    <label for="confirm">Confirmation</label>
    <input id="confirm" type="password" autocomplete="new-password" minlength="8" required>

    <button id="submit" type="submit">Valider</button>
  </form>

  <p class="hint">8 caractères minimum. Le lien n'est utilisable qu'une fois et expire 30 minutes après la demande.</p>
</main>

<script>
  var token = new URLSearchParams(window.location.search).get('token');
  var form = document.getElementById('form');
  var submit = document.getElementById('submit');
  var message = document.getElementById('message');

  function show(text, kind) {
    message.textContent = text;
    message.className = 'msg ' + kind;
  }

  if (!token) {
    form.style.display = 'none';
    show("Ce lien est incomplet. Relancez une demande de réinitialisation depuis l'application.", 'error');
  }

  function errorFor(status, body) {
    if (status === 429) {
      return 'Trop de tentatives. Patientez une minute puis réessayez.';
    }
    if (status === 401) {
      return 'Ce lien est invalide, déjà utilisé ou expiré. Relancez une demande.';
    }
    if (body && body.message) {
      return body.message;
    }
    return 'Le serveur a refusé la demande (erreur ' + status + '). Réessayez ou relancez une demande.';
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    var password = document.getElementById('password').value;
    var confirm = document.getElementById('confirm').value;

    if (password.length < 8) {
      show('Le mot de passe doit faire au moins 8 caractères.', 'error');
      return;
    }
    if (password !== confirm) {
      show('Les deux mots de passe ne sont pas identiques.', 'error');
      return;
    }

    submit.disabled = true;
    show('Envoi en cours…', 'ok');

    fetch('/api/v1/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, newPassword: password })
    }).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (body) {
        return { ok: response.ok, status: response.status, body: body };
      });
    }).then(function (result) {
      if (result.ok) {
        form.style.display = 'none';
        show('Mot de passe modifié. Vous pouvez retourner dans FinSim et vous connecter.', 'ok');
        return;
      }
      submit.disabled = false;
      show(errorFor(result.status, result.body), 'error');
    }).catch(function () {
      submit.disabled = false;
      show('Connexion au serveur impossible. Réessayez dans un instant.', 'error');
    });
  });
</script>
</body>
</html>
